name: Deploy Next.js to Server

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Pull and Reload via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /website/CASAWebsite
            set -e 
            
            git pull origin master
            npm ci --production
            
            npm run build
            
            # Only reloads the website if the build passes 100% perfectly
            pm2 reload nextjs-app || PORT=3000 pm2 start .next/standalone/server.js --name "nextjs-app"
            pm2 save

